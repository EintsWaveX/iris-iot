<title>IRIS Home Bento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
<style>
/* Layout concept: a 12-column bento. Left = greeting + one role card (the primary action), right = Langit Lab as the hero cell, then four module tiles.
   Dark-first (the real app default); light = "Daylight sky". Tokens copied from apps/web theme.css. */
:root {
  color-scheme: dark;
  --void: #05060b; --bg: #0a0c14; --bg-sunken: #04050a;
  --surface-1: #10131f; --surface-2: #161a2b; --surface-3: #1d2238; --surface-4: #262c47;
  --hairline-faint: rgba(205,220,255,.11); --hairline: rgba(205,220,255,.22); --hairline-strong: rgba(205,220,255,.38);
  --text: #eef1f6; --text-muted: #b0b8c8; --text-faint: #98a1b3;
  --accent: #40b0ff; --accent-bright: #8ed0ff; --accent-ink: #04121d; --accent-soft: rgba(64,176,255,.16);
  --danger: #ff6b6b; --warn: #f5b544; --warn-soft: rgba(245,181,68,.15); --ok: #5eead4; --ok-soft: rgba(94,234,212,.15);
  --invert-bg: #eef1f6; --invert-ink: #05060b;
  --g1: #5eead4; --g2: #a78bfa; --g3: #fb7185; --g4: #f59e6a; --g5: #7dd3fc; --g6: #a3e635; --g7: #f472b6; --g8: #fde047; --g9: #93a5ff; --g10: #e2a3ff;
  --m1: #6cc4ff; --m2: #a39cff; --m3: #5fe0b0; --m4: #ffad6b;
  --m1-soft: rgba(108,196,255,.14); --m2-soft: rgba(163,156,255,.14); --m3-soft: rgba(95,224,176,.14); --m4-soft: rgba(255,173,107,.14);
  --sweep: linear-gradient(100deg,#40b0ff,#a78bfa,#fb7185,#f5b544,#5eead4,#7dd3fc,#40b0ff);
  --sweep-surface: linear-gradient(100deg,#40b0ff,#7dd3fc,#5eead4,#a78bfa,#8ed0ff,#40b0ff);
  --shadow-panel: 0 1px 0 rgba(255,255,255,.05) inset, 0 18px 48px rgba(0,0,0,.5);
  --nav-bg: rgba(10,12,20,.78);
  --scene: linear-gradient(180deg,#0c1020 0%,#0a0d19 100%);
  --star-dot: #dbe7ff;
  --font-display: "Plus Jakarta Sans","Inter",system-ui,sans-serif;
  --font-body: "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono: "JetBrains Mono",ui-monospace,Menlo,monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
  --ease: cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --void: #dfe9f6; --bg: #eef3fa; --bg-sunken: #e3ebf6;
  --surface-1: #ffffff; --surface-2: #f6f9fd; --surface-3: #eaf0f8; --surface-4: #dbe5f2;
  --hairline-faint: rgba(16,34,70,.1); --hairline: rgba(16,34,70,.2); --hairline-strong: rgba(16,34,70,.36);
  --text: #0e1626; --text-muted: #3d4a63; --text-faint: #55627c;
  --accent-bright: #075b9f; --accent-soft: rgba(29,132,214,.13);
  --danger: #c4242f; --warn: #8f5700; --warn-soft: rgba(230,150,20,.16); --ok: #0a7a68; --ok-soft: rgba(16,160,136,.13);
  --invert-bg: #0e1626; --invert-ink: #ffffff;
  --g1: #0a796a; --g2: #6a4bd8; --g3: #c42a48; --g4: #ab510f; --g5: #0b6aa6; --g6: #4a770e; --g7: #b3297e; --g8: #866700; --g9: #3f53c9; --g10: #8b3bb8;
  --m1: #0f6fb3; --m2: #5b4fd1; --m3: #08805a; --m4: #b25a14;
  --m1-soft: rgba(15,111,179,.12); --m2-soft: rgba(91,79,209,.12); --m3-soft: rgba(8,128,90,.12); --m4-soft: rgba(178,90,20,.12);
  --shadow-panel: 0 1px 2px rgba(16,34,70,.08), 0 12px 32px rgba(16,34,70,.1);
  --nav-bg: rgba(246,250,255,.82);
  --scene: linear-gradient(180deg,#f3f7fd 0%,#e6eefa 100%);
  --star-dot: transparent;
} }
:root[data-theme="light"] {
  color-scheme: light;
  --void: #dfe9f6; --bg: #eef3fa; --bg-sunken: #e3ebf6;
  --surface-1: #ffffff; --surface-2: #f6f9fd; --surface-3: #eaf0f8; --surface-4: #dbe5f2;
  --hairline-faint: rgba(16,34,70,.1); --hairline: rgba(16,34,70,.2); --hairline-strong: rgba(16,34,70,.36);
  --text: #0e1626; --text-muted: #3d4a63; --text-faint: #55627c;
  --accent-bright: #075b9f; --accent-soft: rgba(29,132,214,.13);
  --danger: #c4242f; --warn: #8f5700; --warn-soft: rgba(230,150,20,.16); --ok: #0a7a68; --ok-soft: rgba(16,160,136,.13);
  --invert-bg: #0e1626; --invert-ink: #ffffff;
  --g1: #0a796a; --g2: #6a4bd8; --g3: #c42a48; --g4: #ab510f; --g5: #0b6aa6; --g6: #4a770e; --g7: #b3297e; --g8: #866700; --g9: #3f53c9; --g10: #8b3bb8;
  --m1: #0f6fb3; --m2: #5b4fd1; --m3: #08805a; --m4: #b25a14;
  --m1-soft: rgba(15,111,179,.12); --m2-soft: rgba(91,79,209,.12); --m3-soft: rgba(8,128,90,.12); --m4-soft: rgba(178,90,20,.12);
  --shadow-panel: 0 1px 2px rgba(16,34,70,.08), 0 12px 32px rgba(16,34,70,.1);
  --nav-bg: rgba(246,250,255,.82);
  --scene: linear-gradient(180deg,#f3f7fd 0%,#e6eefa 100%);
  --star-dot: transparent;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --void: #05060b; --bg: #0a0c14; --bg-sunken: #04050a;
  --surface-1: #10131f; --surface-2: #161a2b; --surface-3: #1d2238; --surface-4: #262c47;
  --hairline-faint: rgba(205,220,255,.11); --hairline: rgba(205,220,255,.22); --hairline-strong: rgba(205,220,255,.38);
  --text: #eef1f6; --text-muted: #b0b8c8; --text-faint: #98a1b3;
  --accent-bright: #8ed0ff; --accent-soft: rgba(64,176,255,.16);
  --danger: #ff6b6b; --warn: #f5b544; --warn-soft: rgba(245,181,68,.15); --ok: #5eead4; --ok-soft: rgba(94,234,212,.15);
  --invert-bg: #eef1f6; --invert-ink: #05060b;
  --g1: #5eead4; --g2: #a78bfa; --g3: #fb7185; --g4: #f59e6a; --g5: #7dd3fc; --g6: #a3e635; --g7: #f472b6; --g8: #fde047; --g9: #93a5ff; --g10: #e2a3ff;
  --m1: #6cc4ff; --m2: #a39cff; --m3: #5fe0b0; --m4: #ffad6b;
  --m1-soft: rgba(108,196,255,.14); --m2-soft: rgba(163,156,255,.14); --m3-soft: rgba(95,224,176,.14); --m4-soft: rgba(255,173,107,.14);
  --shadow-panel: 0 1px 0 rgba(255,255,255,.05) inset, 0 18px 48px rgba(0,0,0,.5);
  --nav-bg: rgba(10,12,20,.78);
  --scene: linear-gradient(180deg,#0c1020 0%,#0a0d19 100%);
  --star-dot: #dbe7ff;
}

* { box-sizing: border-box; }
html { font-size: clamp(87.5%, 82.5% + .21vw, 100%); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 1rem/1.55 var(--font-body);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
  padding-bottom: 96px; overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 90; background: var(--nav-bg); }
::selection { background: var(--accent); color: var(--accent-ink); }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: -.025em; margin: 0; text-wrap: balance; }

/* ---------- sky (static: nothing animates behind a reading) ---------- */
.sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.sky::before { content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(900px 520px at 12% 8%, rgba(58,42,107,.55), transparent 70%),
    radial-gradient(800px 480px at 88% 22%, rgba(27,31,74,.7), transparent 70%),
    radial-gradient(700px 420px at 60% 100%, rgba(15,63,74,.45), transparent 70%),
    linear-gradient(180deg, var(--void), var(--bg) 60%); }
.sky i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: var(--star-dot); opacity: .75; }
:root[data-theme="light"] .sky::before { background:
    radial-gradient(900px 420px at 14% 0%, rgba(255,214,200,.65), transparent 70%),
    radial-gradient(800px 460px at 90% 10%, rgba(196,220,255,.8), transparent 70%),
    radial-gradient(900px 360px at 50% 100%, rgba(200,238,234,.7), transparent 70%),
    linear-gradient(180deg, #dbe8f8, var(--bg) 70%); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .sky::before { background:
    radial-gradient(900px 420px at 14% 0%, rgba(255,214,200,.65), transparent 70%),
    radial-gradient(800px 460px at 90% 10%, rgba(196,220,255,.8), transparent 70%),
    radial-gradient(900px 360px at 50% 100%, rgba(200,238,234,.7), transparent 70%),
    linear-gradient(180deg, #dbe8f8, var(--bg) 70%); } }
.sky b { position: absolute; border-radius: 50%; background: #fff; filter: blur(22px); opacity: 0; }
:root[data-theme="light"] .sky b { opacity: .75; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .sky b { opacity: .75; } }

/* ---------- global navbar (glass on purpose) ---------- */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 80; background: var(--nav-bg); backdrop-filter: blur(14px) saturate(1.3);
  border-bottom: 1px solid var(--hairline-faint); }
.nav__in { max-width: 1640px; margin: 0 auto; height: 60px; display: flex; align-items: center; gap: 24px; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.logo { font: 800 1.35rem/1 var(--font-display); font-style: italic; letter-spacing: -.04em; color: var(--accent-bright); }
.nav__links { display: flex; gap: 22px; font-weight: 600; font-size: .95rem; color: var(--text-muted); overflow-x: auto; scrollbar-width: none; }
.nav__links a { padding: 20px 0 17px; border-bottom: 3px solid transparent; white-space: nowrap; }
.nav__links a[aria-current] { color: var(--text); border-image: var(--sweep) 1; }
.nav__r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.chipbtn { height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--hairline); background: var(--surface-1); color: var(--text); font: 500 .82rem var(--font-mono); display: inline-flex; align-items: center; gap: 6px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 800 .7rem var(--font-body); display: grid; place-items: center; }

/* ---------- page ---------- */
.page { max-width: 1240px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
@media (min-width: 1280px) { .page { gap: 20px; padding-top: 28px; } }
.panel { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: var(--r-lg); box-shadow: var(--shadow-panel); min-width: 0; }
.panel--key { position: relative; }
.panel--key::before { content: ""; position: absolute; left: 14px; right: 14px; top: -1px; height: 2px; background: var(--sweep); border-radius: 2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--hairline); background: var(--surface-2); color: var(--text); font: 700 .7rem/1 var(--font-body); letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
.pill--ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.pill--warn { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.pill--accent { color: var(--accent-bright); border-color: var(--accent); background: var(--accent-soft); }
.pill--mono { font-family: var(--font-mono); letter-spacing: 0; text-transform: none; font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.btn { height: 48px; padding: 0 22px; border-radius: var(--r-md); border: 1px solid var(--hairline-strong); background: var(--surface-2); color: var(--text); font: 700 .95rem var(--font-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: transform 160ms var(--ease), background-color 160ms; }
.btn:hover { transform: translateY(-2px); }
.btn--primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn--inverse { background: var(--invert-bg); color: var(--invert-ink); border-color: transparent; }
.btn--lg { height: 60px; padding: 0 28px; font-size: 1.05rem; }
.btn--sm { height: 40px; padding: 0 16px; font-size: .88rem; }
.btn svg, .tile__go svg { width: 18px; height: 18px; flex: none; }
.btn--grow { flex: 1 1 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- slim recruitment banner ---------- */
.rb { display: flex; align-items: center; gap: 16px; padding: 10px 12px 10px 18px; min-height: 60px; flex-wrap: wrap; }
.rb__txt { flex: 1 1 280px; min-width: 0; }
.rb__t { font: 800 .95rem/1.25 var(--font-display); letter-spacing: -.01em; }
.rb__s { font-size: .86rem; color: var(--text-muted); margin-top: 2px; }
.rb__facts { display: flex; gap: 18px; align-items: baseline; }
.rb__facts b { font: 600 1.05rem var(--font-mono); }
.rb__facts span { font-size: .78rem; color: var(--text-muted); margin-left: 6px; }
.steps { display: flex; gap: 4px; align-items: center; }
.steps i { width: 22px; height: 6px; border-radius: 3px; background: var(--surface-4); }
.steps i.on { background: var(--accent); }

/* ---------- bento ---------- */
.hb { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .hb { grid-template-columns: repeat(2, 1fr); } .hb__left, .hb__sky { grid-column: 1 / -1; } }
@media (min-width: 1100px) { .hb { grid-template-columns: repeat(12, 1fr); gap: 20px; } .hb__left { grid-column: 1 / 6; } .hb__sky { grid-column: 6 / 13; } .hb__mod { grid-column: span 3; } }
.hb__left { display: grid; gap: 16px; grid-template-rows: auto 1fr; min-width: 0; }
.hb__greet { font-size: clamp(1.8rem, 1.2rem + 1.6vw, 2.7rem); line-height: 1.08; overflow-wrap: anywhere; padding-top: 4px; }
.hb__greet small { display: block; font: 600 .95rem var(--font-body); letter-spacing: 0; color: var(--text-muted); margin-bottom: 8px; }

/* role card */
.role { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.role > .row:last-child, .role > a.btn:last-child { margin-top: auto; }
.role__top { display: flex; gap: 16px; align-items: center; }
.role h2 { font-size: 1.28rem; letter-spacing: -.02em; }
.role p { margin: 0; color: var(--text-muted); font-size: .95rem; }
.clock { width: 108px; height: 108px; flex: none; position: relative; }
.clock svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.clock .tr { stroke: var(--surface-4); } .clock .pr { stroke: var(--accent); }
.clock__n { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font: 600 1.5rem/1 var(--font-mono); }
.clock__n small { font: 600 .66rem var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-top: 3px; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-4); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--g3); border-radius: 4px; }
.prog { display: grid; gap: 8px; }
.prog__l { display: flex; justify-content: space-between; font-size: .88rem; color: var(--text-muted); }
.prog__l b { font: 600 .95rem var(--font-mono); color: var(--text); }
.journey { display: flex; align-items: center; gap: 0; }
.journey i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--hairline-strong); background: var(--surface-1); flex: none; }
.journey i.on { background: var(--accent); border-color: var(--accent); }
.journey u { height: 2px; flex: 1; background: var(--hairline); }
.journey u.on { background: var(--accent); }
/* asisten day strip */
.strip { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-top: 22px; }
.strip div { height: 46px; border: 1px solid var(--hairline); border-radius: var(--r-md); background: var(--surface-2); padding: 6px 10px; font: 500 .85rem var(--font-mono); color: var(--text-muted); }
.strip em { position: absolute; top: 0; left: 11%; font: 600 .72rem var(--font-mono); font-style: normal; background: var(--ok); color: var(--surface-1); padding: 2px 6px; border-radius: 5px; }
.strip em::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 30px; background: var(--ok); }
.big { font: 600 1.6rem/1.2 var(--font-mono); letter-spacing: -.02em; }
.sub { font-size: .85rem; color: var(--text-muted); }

/* ---------- Langit Lab (hero cell) ---------- */
.lab { display: grid; grid-template-rows: auto 1fr auto; padding: 20px; gap: 14px; height: 100%; }
.lab__h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lab__h h2 { font-size: 1.28rem; margin-right: auto; }
.pulse { animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.scene { background: var(--scene); border: 1px solid var(--hairline-faint); border-radius: var(--r-lg); min-height: 250px; position: relative; overflow: hidden; }
.scene svg { display: block; width: 100%; height: 100%; min-height: 250px; }
.scene text { font-family: var(--font-body); }
.ring { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.more { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 2px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--surface-2); border: 1px solid var(--hairline-faint); border-radius: var(--r-md); padding: 10px 12px; min-width: 0; }
.stat b { display: block; font: 600 1.25rem/1.2 var(--font-mono); letter-spacing: -.02em; }
.stat span { font-size: .78rem; color: var(--text-muted); }
.hint { font-size: .85rem; color: var(--text-muted); margin: 0; }

/* ---------- module tiles ---------- */
.tiles { display: contents; }
@media (max-width: 639px) { .tiles { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; grid-column: 1 / -1; } .tiles .tile { flex: 0 0 84%; scroll-snap-align: start; } }
.tile { display: grid; grid-template-rows: auto 1fr auto; gap: 10px; padding: 16px; background: var(--surface-1); border: 1px solid var(--hairline); border-radius: var(--r-lg); box-shadow: var(--shadow-panel); transition: transform 200ms var(--ease), border-color 200ms; min-width: 0; position: relative; }
.tile:hover { transform: translateY(-4px); border-color: var(--tc); }
.tile__art { background: var(--tcs); border-radius: var(--r-md); height: 112px; display: grid; place-items: center; }
.tile__art svg { width: 100%; height: 100%; }
.tile__top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.tile .pill { color: var(--tc); border-color: var(--tc); background: var(--tcs); }
.tile__via { font: 500 .78rem var(--font-mono); color: var(--text-muted); }
.tile h3 { font-size: 1.15rem; letter-spacing: -.02em; }
.tile p { margin: 4px 0 0; font-size: .88rem; color: var(--text-muted); }
.tile__go { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: .9rem; color: var(--tc); }

/* ---------- visitor hero ---------- */
.vh { display: grid; gap: 20px; align-items: stretch; }
@media (min-width: 1000px) { .vh { grid-template-columns: 1.05fr 1fr; gap: 28px; } }
.vh__l { display: grid; gap: 18px; align-content: center; padding: 8px 0; min-width: 0; }
.vh__logo { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; background: var(--surface-1); border: 1px solid var(--hairline); box-shadow: var(--shadow-panel); font: 800 1.5rem var(--font-display); font-style: italic; color: var(--accent-bright); }
.vh h1 { font-size: clamp(2.3rem, 1.4rem + 3.6vw, 4.4rem); line-height: 1.02; }
.vh h1 span { color: var(--accent-bright); }
.vh__lede { max-width: 52ch; color: var(--text-muted); font-size: 1.08rem; margin: 0; }
.vh__stats { display: grid; grid-template-columns: repeat(4, auto); gap: 8px 28px; justify-content: start; margin: 4px 0 0; padding-top: 18px; border-top: 1px solid var(--hairline-faint); }
.vh__stats div { display: grid; }
.vh__stats dt { order: 2; font-size: .8rem; color: var(--text-muted); }
.vh__stats dd { margin: 0; font: 600 1.7rem/1.1 var(--font-mono); letter-spacing: -.03em; }

      '<div class="photos" aria-hidden="true"><div class="photo photo--a">Foto jaket lab</div><div class="photo photo--b">Foto papan ESP32</div></div></div></section>' +
      '<section class="sec"><h2>Enam Divisi, Satu Lab</h2><div class="divs">' + DIVS.map(function (d, i) { return '<a class="div" href="#"><h3>' + d[0] + '</h3><p>' + d[1] + '</p><div class="faces" aria-hidden="true">' + [0,1,2,3].map(function (k) { return '<i style="background:' + cols[(i + k) % 6] + '">' + String.fromCharCode(65 + ((i * 3 + k * 5) % 26)) + '</i>'; }).join("") + '</div></a>'; }).join("") + '</div></section>' +
      '<div class="rest">Logo, Foto Bersama, dan Acara memakai isi dan perilaku yang sama seperti sekarang, dengan bahasa kartu yang sama.</div>';
  }

  /* ---------- render ---------- */
  function render() {
    var v = state.view, k = state.banner === "auto" ? DEFAULT_BANNER[v] : state.banner;
    var name = state.worst ? "Immanuel Eben Haezer Joseph Aletheia" : "Rani Putri", ini = state.worst ? "IE" : "RP";
    var links = v === "visitor" ? [["Beranda",1],["Modul"]] : v.indexOf("asisten") === 0 ? [["Beranda",1],["Konsol"],["Persiapan"],["Penilaian"],["Jadwal"],["Lab"]] : [["Beranda",1],["Dasbor"],["Modul"]];
    $("#links").innerHTML = links.map(function (l) { return '<a href="#"' + (l[1] ? ' aria-current="page"' : '') + '>' + l[0] + '</a>'; }).join("");
    $("#avatar").textContent = v === "visitor" ? "?" : ini;
    var html = banner(k), main;
    if (v === "visitor") main = visitorHero();
    else {
      var left, sky;
      if (v === "prak-live") { left = greet(name, "Praktikum IoT · Laboratorium IRIS") + rolePrakLive(); sky = skyLive(state.worst); }
      else if (v === "prak-idle") { left = greet(name, "Praktikum IoT · Laboratorium IRIS") + rolePrakIdle(); sky = skyQuiet(false); }
      else if (v === "asisten") { left = greet(name, "Praktikum IoT · Laboratorium IRIS") + roleAsisten(false); sky = skyQuiet(false); }
      else { left = greet(name, "Praktikum IoT · Laboratorium IRIS") + roleAsisten(true); sky = skyLive(state.worst); }
      main = '<div class="hb"><div class="hb__left">' + left + '</div><div class="hb__sky">' + sky + '</div>' + tiles().replace(/class="tile /g, 'class="hb__mod tile ') + '</div>';
    }
    $("#page").innerHTML = html + main + profile();
    $("#views").innerHTML = VIEWS.map(function (x) { return '<button data-v="' + x[0] + '" aria-pressed="' + (state.view === x[0]) + '">' + x[1] + '</button>'; }).join("");
    $("#banners").innerHTML = BANNERS.map(function (x) { return '<button data-b="' + x[0] + '" aria-pressed="' + (state.banner === x[0]) + '">' + x[1] + '</button>'; }).join("");
    $("#worst").setAttribute("aria-pressed", String(state.worst));
    $("#th-d").setAttribute("aria-pressed", String(state.theme === "dark")); $("#th-l").setAttribute("aria-pressed", String(state.theme === "light"));
    document.documentElement.setAttribute("data-theme", state.theme);
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-v],[data-b],[data-ch],#worst,#th-d,#th-l,a[href='#']");
    if (!t) return;
    if (t.matches("a[href='#']") && !t.hasAttribute("data-ch")) { e.preventDefault(); return; }
    if (t.dataset.v) state.view = t.dataset.v;
    else if (t.dataset.b) state.banner = t.dataset.b;
    else if (t.dataset.ch) { e.preventDefault(); state.chap = t.dataset.ch; }
    else if (t.id === "worst") state.worst = !state.worst;
    else if (t.id === "th-d") state.theme = "dark";
    else if (t.id === "th-l") state.theme = "light";
    render();
  });
  render();
})();
</script>
