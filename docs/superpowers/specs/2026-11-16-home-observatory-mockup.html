<title>IRIS Home Observatory</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>

   light = "Golden Hour" (low sun, clouds, pastel planets, ridges). Both carry a ground-station dish sending signal arcs up to the group stars.
   Panels, label chips and the stats strip are solid; only the sky is atmosphere. Tokens from apps/web theme.css. */

  color-scheme: dark;

  --accent: #40b0ff; --accent-bright: #8ed0ff; --accent-ink: #04121d; --accent-soft: rgba(64,176,255,.16);
  --warn: #f5b544; --ok: #5eead4;
  --invert-bg: #eef1f6; --invert-ink: #05060b;

  --m1-soft: rgba(108,196,255,.14); --m2-soft: rgba(163,156,255,.14); --m3-soft: rgba(95,224,176,.14); --m4-soft: rgba(255,173,107,.14);
  --sweep: linear-gradient(100deg,#40b0ff,#a78bfa,#fb7185,#f5b544,#5eead4,#7dd3fc,#40b0ff);
  --sweep-surface: linear-gradient(100deg,#40b0ff,#7dd3fc,#5eead4,#a78bfa,#8ed0ff,#40b0ff);
  --shadow-panel: 0 1px 0 rgba(255,255,255,.05) inset, 0 18px 48px rgba(0,0,0,.5);
  --nav-bg: rgba(10,12,20,.78); --logo-filter: none;
  /* Night Watch */
  --sky-top: #03040b; --sky-mid: #0a0d24; --sky-low: #15133a;
  --glow-a: rgba(86,52,170,.55); --glow-b: rgba(18,100,120,.42); --glow-c: rgba(150,48,100,.26);
  --pl1: #9078ff; --pl2: #2b1b72; --ring: #aab4e8; --moon1: #d8dbe6; --moon2: #7b8196;
  --band1: #2072a0; --band2: #123f68; --band3: #3aa6bd;

  --dkd: inline; --ltd: none;
  --font-display: "Plus Jakarta Sans","Inter",system-ui,sans-serif;
  --font-body: "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono: "JetBrains Mono",ui-monospace,Menlo,monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
  --ease: cubic-bezier(.16,1,.3,1);
}

  --dish: #1b2a4b; --arc: #075b9f; --dot: transparent;
  --dkd: none; --ltd: inline;
} }

  --hairline-faint: rgba(205,220,255,.11); --hairline: rgba(205,220,255,.22); --hairline-strong: rgba(205,220,255,.38);

  --invert-bg: #eef1f6; --invert-ink: #05060b;
  --g1: #5eead4; --g2: #a78bfa; --g3: #fb7185; --g4: #f59e6a; --g5: #7dd3fc; --g6: #a3e635; --g7: #f472b6; --g8: #fde047; --g9: #93a5ff; --g10: #e2a3ff;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: clamp(87.5%, 82.5% + .21vw, 100%); }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 1rem/1.55 var(--font-body); padding-bottom: 96px; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 90; background: var(--nav-bg); }
::selection { background: var(--accent); color: var(--accent-ink); }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: -.025em; word-spacing: .12em; margin: 0; text-wrap: balance; }

/* ---------- global navbar (glass on purpose) ---------- */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 80; background: var(--nav-bg); backdrop-filter: blur(14px) saturate(1.3); border-bottom: 1px solid var(--hairline-faint); }
.nav__in { max-width: 1640px; margin: 0 auto; height: 60px; display: flex; align-items: center; gap: 24px; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); position: relative; }
.logo { height: 36px; width: auto; filter: var(--logo-filter); display: block; }
.nav__links { display: flex; gap: 22px; font-weight: 600; font-size: .95rem; color: var(--text-muted); overflow-x: auto; scrollbar-width: none; }
.nav__links a { padding: 20px 0 17px; border-bottom: 3px solid transparent; white-space: nowrap; }
.nav__links a[aria-current] { color: var(--text); border-image: var(--sweep) 1; }
.nav__cta { position: absolute; left: 50%; translate: -50% 0; } /* `translate`, not `transform`: the hover lift owns `transform` */
.nav__r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.chipbtn { height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--hairline); background: var(--surface-1); color: var(--text); font: 500 .82rem var(--font-mono); display: inline-flex; align-items: center; gap: 8px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 800 .7rem var(--font-body); display: grid; place-items: center; }

/* ---------- shared bits ---------- */
.page { max-width: 1240px; margin: 0 auto; padding: 44px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 32px; }
.panel { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: var(--r-lg); box-shadow: var(--shadow-panel); min-width: 0; }
.panel--key { position: relative; }
.panel--key::before { content: ""; position: absolute; left: 14px; right: 14px; top: -1px; height: 2px; background: var(--sweep); border-radius: 2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--hairline-strong); background: var(--surface-1); color: var(--text); font: 700 .7rem/1 var(--font-body); letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
.pill--ok { color: var(--ok); border-color: var(--ok); }
.pill--warn { color: var(--warn); border-color: var(--warn); }
.pill--accent { color: var(--accent-bright); border-color: var(--accent); }
.pill--mono { font-family: var(--font-mono); letter-spacing: 0; text-transform: none; font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.btn { height: 48px; padding: 0 22px; border-radius: var(--r-md); border: 1px solid var(--hairline-strong); background: var(--surface-2); color: var(--text); font: 700 .95rem var(--font-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: transform 160ms var(--ease); white-space: nowrap; }
.btn:hover { transform: translateY(-2px); }
.btn--primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn--inverse { background: var(--invert-bg); color: var(--invert-ink); border-color: transparent; }
.btn--lg { height: 56px; padding: 0 26px; font-size: 1rem; }
.btn--sm { height: 40px; padding: 0 16px; font-size: .88rem; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn--grow { flex: 1 1 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sub { font-size: .85rem; color: var(--text-muted); }

/* ---------- slim recruitment banner ---------- */
.rb { display: flex; align-items: center; gap: 14px; padding: 8px 10px 8px 18px; min-height: 56px; flex-wrap: wrap; }
.rb__txt { flex: 1 1 260px; min-width: 0; }
.rb__t { font: 800 .92rem/1.25 var(--font-display); letter-spacing: -.01em; }
.rb__s { font-size: .84rem; color: var(--text-muted); }
.rb__facts { display: flex; gap: 18px; align-items: baseline; }
.rb__facts b { font: 600 1rem var(--font-mono); }
.rb__facts span { font-size: .78rem; color: var(--text-muted); margin-left: 6px; }
.steps { display: flex; gap: 4px; }
.steps i { width: 20px; height: 6px; border-radius: 3px; background: var(--surface-4); }
.steps i.on { background: var(--accent); }

/* ---------- the cosmos (first screen) ---------- */
.cosmos { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 58%, var(--sky-low)); isolation: isolate; }
.cosmos__art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.cosmos__grain { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: .025; mix-blend-mode: overlay; background-size: 160px 160px; }
.cosmos__ticks { position: absolute; inset: 0; z-index: 0; pointer-events: none; color: var(--text); opacity: .22; }
.cosmos__fade { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; z-index: 0; background: linear-gradient(180deg, transparent, var(--bg)); }
.cosmos__in { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); --bt: 0px; }
.cosmos__in[data-banner="yes"] { --bt: 152px; }
.nav__cta { display: none; }
@media (min-width: 900px) { .nav__cta { display: inline-flex; } }
.area { position: relative; height: 380px; }
.head { position: absolute; left: 0; top: calc(var(--bt) + 4px); display: grid; gap: 8px; padding: 10px 14px; background: var(--surface-1); border: 1px solid var(--hairline); border-radius: var(--r-lg); box-shadow: var(--shadow-panel); z-index: 2; max-width: 280px; }
.head h2 { font-size: 1.1rem; }
.head p { margin: 0; font-size: .82rem; color: var(--text-muted); }
.field { position: absolute; left: 3%; right: 3%; top: calc(var(--bt) + 84px); bottom: 24px; }
.field svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.links line { stroke: var(--accent-bright); stroke-width: 1.2; opacity: .55; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 3px var(--accent-bright)); }
.star { position: absolute; width: 0; height: 0; --r: calc(14px + var(--p) * 14px); }
.star__halo, .star__core, .star__ring { position: absolute; left: 0; top: 0; border-radius: 50%; transform: translate(-50%, -50%); }
.star__halo { width: calc(var(--r) * 2.4); height: calc(var(--r) * 2.4); background: radial-gradient(circle, var(--c), transparent 66%); opacity: .38; }
.star__core { width: calc(18px + var(--p) * 16px); height: calc(18px + var(--p) * 16px); border-radius: 0; background: radial-gradient(circle, #fff 0 22%, var(--c) 70%); clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%); }
.star__ring { width: calc(var(--r) * 2 + 8px); height: calc(var(--r) * 2 + 8px); border: 1px dashed var(--accent-bright); }
.star__lead { position: absolute; left: 4px; top: 4px; width: 20px; height: 1px; background: var(--hairline-strong); transform-origin: 0 0; transform: rotate(45deg); }
.star__t { position: absolute; left: 18px; top: 18px; text-align: left; white-space: nowrap; background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 6px; padding: 3px 9px 4px; }
.star__t b { display: block; font: 700 .78rem/1.25 var(--font-body); color: var(--text); }
.star__t span { display: block; font: 500 .7rem/1.3 var(--font-mono); color: var(--text-muted); }
.qcons { position: absolute; inset: 0; width: 100%; height: 100%; }
.qlab { position: absolute; transform: translateX(-50%); }
.panel.obs { position: relative; padding: 24px; display: grid; gap: 18px; margin-top: -8px; }
.obs h1 { font-size: clamp(1.7rem, 1.1rem + 1.6vw, 2.5rem); line-height: 1.08; overflow-wrap: anywhere; }
.strip { margin-top: 12px; background: var(--surface-1); border: 1px solid var(--hairline); border-radius: var(--r-lg); box-shadow: var(--shadow-panel); display: grid; grid-template-columns: repeat(2, 1fr); }
.strip div { padding: 12px 16px; min-width: 0; border-top: 1px solid var(--hairline-faint); }
.strip div:nth-child(-n+2) { border-top: 0; }
.strip div:nth-child(even) { border-left: 1px solid var(--hairline-faint); }
.strip b { display: block; font: 600 1.35rem/1.15 var(--font-mono); letter-spacing: -.02em; }
.strip span { font-size: .78rem; color: var(--text-muted); }
.cosmos__tail { padding-bottom: 20px; }
.cosmos__ticks { background:
  repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 40px) top / 100% 7px no-repeat,
  repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 200px) top / 100% 14px no-repeat,
  repeating-linear-gradient(180deg, currentColor 0 1px, transparent 1px 40px) left / 7px 100% no-repeat,
  repeating-linear-gradient(180deg, currentColor 0 1px, transparent 1px 200px) left / 14px 100% no-repeat; }

/* Open Recruitment banner: icon, title, live countdown, 7-stage rail, actions */
.ob { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px 26px; padding: 18px 22px 18px 18px; }
.ob__ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-bright); border: 1px solid var(--hairline); }
.ob__ic svg { width: 26px; height: 26px; }
.ob__main { min-width: 0; display: grid; gap: 16px; }
.ob__head { display: flex; gap: 6px 14px; align-items: center; flex-wrap: wrap; }
.ob__t { font: 800 1.05rem/1.2 var(--font-display); letter-spacing: -.015em; word-spacing: .12em; }
.ob__s { font-size: .86rem; color: var(--text-muted); }
.rail { display: grid; grid-template-columns: repeat(7, 1fr); position: relative; --pg: 0; }
.rail::before { content: ""; position: absolute; left: calc(100% / 14); right: calc(100% / 14); top: 5px; height: 1px; background: var(--hairline-strong); }
.rail::after { content: ""; position: absolute; left: calc(100% / 14); width: calc((100% - 100% / 7) * var(--pg)); top: 4px; height: 3px; border-radius: 2px; background: var(--sweep); }
.rail i { position: relative; z-index: 1; display: grid; justify-items: center; gap: 6px; font-style: normal; }
.rail i::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--surface-1); border: 2px solid var(--hairline-strong); }
.rail i.done::before { background: var(--accent); border-color: var(--accent); }
.rail i.now::before { border-color: var(--accent-bright); box-shadow: 0 0 0 4px var(--accent-soft); }
.rail span { font-size: .68rem; font-weight: 600; letter-spacing: .02em; color: var(--text-muted); white-space: nowrap; }
.rail i.now span { color: var(--text); }
.ob__side { display: grid; gap: 8px; justify-items: end; align-content: center; }
.cd { text-align: right; line-height: 1.15; }
.cd b { display: block; font: 600 1.2rem/1.1 var(--font-mono); letter-spacing: -.02em; }
.cd span { font-size: .72rem; color: var(--text-muted); }
@media (max-width: 899px) {
  .ob { grid-template-columns: auto 1fr; }
  .ob__side { grid-column: 1 / -1; grid-auto-flow: column; justify-content: space-between; justify-items: start; align-items: center; }
  .rail span { display: none; } .rail i.now span { display: block; position: absolute; top: 18px; }

    if (kind === "visitor") { sub = 'Pendaftaran dibuka sampai <span class="mono">20 November</span>'; now = 0; side = '<div class="cd"><b>4 hari 3 jam</b><span>sampai pendaftaran tutup</span></div><div class="row"><a class="btn btn--sm" href="#">Lihat Tahapan</a><a class="btn btn--sm btn--primary" href="#">Daftar ' + ICON.arrow + '</a></div>'; }
    if (kind === "candidate") { sub = 'Langkah berikutnya: <b style="color:var(--text)">Buka Hasil Tes Tulis</b>'; now = 3; side = '<div class="cd"><b>4/7</b><span>tahap selesai</span></div><a class="btn btn--sm btn--primary" href="#">Buka ' + ICON.arrow + '</a>'; }
    if (kind === "panitia") { title = "Panitia Akademik"; sub = 'Hari ini: Cutting Tes Tulis.'; now = 3; side = '<div class="rb__facts"><div><b>49</b><span>pendaftar</span></div><div><b>0</b><span>menunggu verifikasi</span></div></div><a class="btn btn--sm btn--primary" href="#">Buka Panel ' + ICON.arrow + '</a>'; }
    if (kind === "asisten") { sub = 'Hari ini: Cutting Tes Tulis.'; now = 3; side = '<a class="btn btn--sm" href="#">Kalender ' + ICON.arrow + '</a>'; }
    var live = kind === "visitor" ? '<span class="pill pill--ok"><span class="dot pulse"></span>Buka Sekarang</span>' : '';
    return '<div class="cosmos__banner"><div class="panel ob rise" style="--i:0"><div class="ob__ic">' + BIC + '</div><div class="ob__main"><div class="ob__head"><span class="ob__t">' + title + '</span>' + live + '<span class="ob__s">' + sub + '</span></div>' + rail(now) + '</div><div class="ob__side">' + side + '</div></div></div>';
  }
  function clock(min, total) {
    var C = 2 * Math.PI * 40, off = C * (1 - min / total);
    return '<div class="clock" role="img" aria-label="Sisa ' + min + ' menit"><svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="40" fill="none" stroke-width="8"/><circle class="pr" cx="50" cy="50" r="40" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg><div class="clock__n">' + min + '<small>menit</small></div></div>';
  }
  function pPrakLive(name) {
    return '<h1>Halo, ' + name + '</h1><div class="role"><div class="role__top">' + clock(48, 90) + '<div style="min-width:0"><div class="row" style="margin-bottom:6px"><span class="pill pill--ok"><span class="dot pulse"></span>Sedang Praktikum</span><span class="pill" style="color:var(--g2);border-color:var(--g2)">Kelompok 2 · Nova</span></div><h2>Modul 3 · MQTT</h2></div></div>' +
      '<div><div class="prog__l"><span>Blank kode yang sudah benar</span><b>12/18</b></div><div class="bar"><i style="width:66.6%;background:var(--g2)"></i></div></div>' +
      '<div class="row"><a class="btn btn--primary btn--grow" href="#">Lanjutkan Modul 3 ' + ICON.arrow + '</a><a class="btn" href="#">Dasbor</a></div></div>';
  }
  function pPrakIdle(name) {
    return '<h1>Halo, ' + name + '</h1><div class="role"><div class="row"><span class="pill" style="color:var(--g2);border-color:var(--g2)">Kelompok 2 · Nova</span></div><p>Sesimu belum berjalan. Nilai, riwayat, dan modul yang sudah kamu ikuti ada di Dasbor.</p>' +
      '<div><div class="journey" aria-label="Modul 1 dan 2 selesai"><i class="on"></i><u class="on"></u><i class="on"></i><u></u><i></i><u></u><i></i></div><div class="prog__l" style="margin:8px 0 0"><span>Modul 1</span><span>Modul 2</span><span>Modul 3</span><span>Modul 4</span></div></div>' +
      '<a class="btn btn--inverse" href="#">Dasbor ' + ICON.arrow + '</a></div>';
  }
  function pAsisten(name, live) {
    var head = '<div class="row" style="justify-content:space-between"><span class="pill pill--mono">Hari ini · Senin</span><a href="#" class="pill pill--warn">Menunggu Kamu <b class="mono" style="font-size:.8rem">7</b></a></div>';
    var strip = '<div class="dstrip" aria-label="Slot hari ini"><em>08.17</em><div>06.30</div><div>09.30</div><div>12.30</div><div>15.30</div></div>';
    if (live) return '<h1>Halo, ' + name + '</h1><div class="role">' + head + '<div class="role__top">' + clock(48, 90) + '<div style="min-width:0"><div class="row" style="margin-bottom:6px"><span class="pill pill--ok"><span class="dot pulse"></span>Sesi Berjalan</span><span class="pill">Internasional</span></div><h2>Modul 3 · MQTT</h2><p>Kamu memegang Kelompok 2 dan 4.</p></div></div><div class="row"><a class="btn btn--inverse btn--grow" href="#">Buka Papan ' + ICON.arrow + '</a><a class="btn" href="#">Jadwal</a></div></div>';
    return '<h1>Halo, ' + name + '</h1><div class="role">' + head + strip + '<div><div class="sub">Slotmu Berikutnya</div><div class="big">Kamis · 09.30</div></div><div class="row"><span class="pill pill--accent">3 hari lagi</span><span class="pill">Internasional</span><span class="pill">Kelompok 3</span></div><div class="row"><a class="btn btn--inverse btn--grow" href="#">Buka Konsol ' + ICON.arrow + '</a><a class="btn" href="#">Jadwal</a></div></div>';
  }

  var NAMES = ["Aurora","Nova","Kometa","Orbit","Pulsar","Zenit","Galaksi","Nebula","Meteor","Kosmos"];
  var PROG = [18,15,13,11,7,3,9,6,12,5];
  function areaLive(n) {
    var pts = placeStars(n), links = "", stars = "", i;
    for (i = 0; i + 1 < n; i++) links += '<line x1="' + pts[i].x.toFixed(1) + '" y1="' + pts[i].y.toFixed(1) + '" x2="' + pts[i + 1].x.toFixed(1) + '" y2="' + pts[i + 1].y.toFixed(1) + '"/>';
    for (i = 0; i < n; i++) {
      var p = PROG[i] / 18, own = i === 1;
      stars += '<div class="star" style="left:' + pts[i].x.toFixed(2) + '%;top:' + (pts[i].y / 60 * 100).toFixed(2) + '%;--p:' + p.toFixed(2) + ';--c:var(--g' + (i + 1) + ');--i:' + i + '"><span class="star__halo"></span>' + (own ? '<span class="star__ring"></span>' : '') + '<span class="star__core"></span><span class="star__lead"></span><div class="star__t"><b>' + (i + 1) + ' · ' + NAMES[i] + '</b><span>' + (PROG[i] === 18 ? 'blank lengkap' : PROG[i] + '/18 benar') + '</span></div></div>';
    }
    return '<div class="head"><h2>Langit Lab</h2><div class="row"><span class="pill" style="color:var(--m3);border-color:var(--m3)">Modul 3 · MQTT</span><span class="pill pill--ok"><span class="dot pulse"></span>Langsung</span></div></div><div class="field"><svg class="links" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true">' + links + '</svg>' + stars + '</div>';
  }
  function areaQuiet(guest) {
    var body = 'Belum ada sesi yang berjalan. Begitu sesi dimulai, tiap kelompok muncul di sini sebagai bintang yang makin terang seiring kemajuannya.';
    var pos = [[8,4],[56,4],[8,34],[56,34]], i, g = "";
    for (i = 0; i < 4; i++) g += '<g transform="translate(' + pos[i][0] + ' ' + pos[i][1] + ') scale(.36)">' + constellation(i + 1, { op: .95, lw: 1.4 }) + '</g>';
    var labs = "";
    for (i = 0; i < 4; i++) labs += '<span class="qlab pill" style="left:' + (pos[i][0] + 18) + '%;top:' + (pos[i][1] / 60 * 100 + 36) + '%;color:var(--m' + (i + 1) + ');border-color:var(--m' + (i + 1) + ')">Modul ' + (i + 1) + '</span>';
    return '<div class="head"><h2>Langit Lab</h2><div class="row"><span class="pill">Sepi</span></div><p>' + body + '</p></div><div class="field"><svg class="qcons" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' + g + '</svg>' + labs + '</div>';
  }
  function strip(items) { return '<div class="strip rise" style="--i:3">' + items.map(function (s) { return '<div><b>' + s[0] + '</b><span>' + s[1] + '</span></div>'; }).join("") + '</div>'; }
  function signedHero(ban, panel, area, stats) {
    return cosmos((ban ? banner(ban) : '') + '<div class="cosmos__in" data-banner="' + (ban ? "yes" : "no") + '"><div class="area">' + area + '</div><section class="panel panel--key obs rise" style="--i:2">' + panel + '</section>' + strip(stats) + '<div class="cosmos__tail"></div></div>', { seed: 11 }).replace('<div class="cosmos__in"', '<div class="cosmos__in"');
  }
  function visitorHero(ban) {
    var inner = '<div class="cosmos__in" data-banner="' + (ban ? "yes" : "no") + '" style="height:100%;max-width:none;padding:0"><div class="vhero"><div class="vlogo-wrap rise" style="--i:1"><img class="vlogo" alt="IRIS IoT Runtime Integration System" src="' + LOGO + '"><div class="vstat vstat--1"><b>24</b><span>Asisten Aktif</span></div><div class="vstat vstat--2"><b>6</b><span>Divisi</span></div><div class="vstat vstat--3"><b>4</b><span>Modul Praktikum</span></div><div class="vstat vstat--4"><b>1</b><span>Acara Terlaksana</span></div></div><h1 class="rise" style="--i:2">Laboratorium <span>IRIS</span></h1><p class="lede rise" style="--i:3">Tempat praktikum Pemrograman Perangkat IoT di Telkom University. Kami menyiapkan modul, papan dan sesinya, dari Bluetooth sampai LoRa, dan membuka lab untuk siapa pun yang ingin belajar IoT.</p><div class="row rise" style="--i:4;gap:10px;justify-content:center"><a class="btn btn--lg" href="#">Lihat Modul</a><a class="btn btn--lg btn--primary" href="#">' + ICON.door + 'Praktikum</a></div></div>' +
      '</div>';
    return cosmos((ban ? banner(ban) : '') + inner, { visitor: true, seed: 3 });
  }

  var MODS = [
    { n: 1, t: "Bluetooth Low Energy", via: "ESP32 · GATT", d: "Central dan Peripheral bicara langsung lewat Bluetooth." },
    { n: 2, t: "WebSocket", via: "ESP32 · WebSocket", d: "Data sensor dikirim ke server Python lewat Wi-Fi lab." },
    { n: 3, t: "MQTT", via: "Pico W · Mosquitto", d: "Pesan lewat broker di tengah, satu terbit, satu berlangganan." },
    { n: 4, t: "LoRa", via: "ESP32 · LoRa P2P", d: "Berburu sinyal radio jarak jauh di seluruh gedung." }
  ];
  function band() {
    return '<div class="panel band rise" style="--i:4">' + MODS.map(function (m) {
      return '<a class="seg" style="--tc:var(--m' + m.n + ');--tcs:var(--m' + m.n + '-soft)" href="#"><div class="seg__top"><span class="pill">Modul ' + m.n + '</span><span class="seg__via">' + m.via + '</span></div><svg viewBox="0 0 100 50" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' + constellation(m.n, { lw: .8 }) + '</svg><div><h3>' + m.t + '</h3><p>' + m.d + '</p></div><span class="seg__go">Baca Modul ' + ICON.arrow + '</span></a>';
    }).join("") + '</div>';
  }
  var DIVS = [["Akademik","Menyusun modul, soal, dan penilaian praktikum."],["Pengembangan","Merawat papan, server, dan web praktikum."],["Media","Foto, video, dan desain untuk semua acara lab."],["Kemitraan","Menghubungkan lab dengan kampus dan industri."],["Rumah Tangga","Menjaga ruang lab dan peralatannya tetap siap."],["Riset","Mencoba teknologi baru sebelum masuk modul."]];
  function profile() {
    var chap = [["tentang","Tentang"],["logo","Logo"],["divisi","Divisi"],["foto","Foto"],["acara","Acara"]].map(function (c) { return '<a href="#" data-ch="' + c[0] + '"' + (state.chap === c[0] ? ' aria-current="true"' : '') + '>' + c[1] + '</a>'; }).join("");
    var cols = ["var(--g1)","var(--g2)","var(--g3)","var(--g4)","var(--g5)","var(--g6)"];
    return '<nav class="chap" aria-label="Bab profil lab">' + chap + '</nav>' +
      '<section class="sec"><div class="about"><div><h2 style="margin-bottom:16px">IoT Runtime and Integration System</h2><p class="lead">IRIS Laboratory adalah laboratorium di bawah naungan Fakultas Teknik Elektro dengan fokus utama pengembangan Internet of Things (IoT), salah satu pilar penting dalam teknologi.</p><p>IRIS mendukung kegiatan praktikum IoT dengan program utama Praktikum Internet of Things. Lewat praktikum ini mahasiswa tidak hanya memahami konsep dasar IoT, tetapi juga berpengalaman merancang dan menerapkan sistem untuk kebutuhan nyata.</p><div class="chips"><span>Pemrograman mikrokontroler</span><span>Sensor dan aktuator</span><span>Komunikasi perangkat</span><span>Integrasi sistem</span><span>IoT dengan jaringan dan cloud</span></div></div><div class="photos" aria-hidden="true"><div class="photo photo--a">Foto jaket lab</div><div class="photo photo--b">Foto papan ESP32</div></div></div></section>' +
      '<section class="sec"><h2>Enam Divisi, Satu Lab</h2><div class="panel divs">' + DIVS.map(function (d, i) { return '<a class="div" href="#"><h3>' + d[0] + '</h3><p>' + d[1] + '</p><div class="faces" aria-hidden="true">' + [0,1,2,3].map(function (k) { return '<i style="background:' + cols[(i + k) % 6] + '">' + String.fromCharCode(65 + ((i * 3 + k * 5) % 26)) + '</i>'; }).join("") + '</div></a>'; }).join("") + '</div></section>' +
      '<div class="rest">Logo, Foto Bersama, dan Acara memakai isi dan perilaku yang sama seperti sekarang, dengan bahasa kartu yang sama.</div>';
  }

  /* ---------- profile v2: Filosofi Logo + Enam Divisi ---------- */
  var LOGO_PARTS = [
    ["awan", "Awan", "Platform runtime dan infrastruktur yang fleksibel dan bisa diakses dari mana saja.", "73%", "22%", "21%"],
    ["wifi", "Wi-Fi", "Komunikasi nirkabel dan pertukaran data, jembatan utama yang menghubungkan perangkat keras ke internet.", "61%", "27%", "12%"],
    ["warna", "Warna", "Biru neon: kepercayaan, stabilitas dan profesionalisme.", "50%", "50%", "90%"],
    ["huruf", "Huruf IRIS", "Bentuk hurufnya menyerupai jalur PCB: koneksi antarperangkat, jalur komunikasi data, sistem embedded dan IoT.", "36%", "62%", "36%"]
  ];
  function logoInner() {
    var cur = LOGO_PARTS.filter(function (p) { return p[0] === state.logo; })[0] || LOGO_PARTS[0];
    var list = LOGO_PARTS.map(function (p, i) {
      return '<button class="lp" data-lp="' + p[0] + '" aria-pressed="' + (p[0] === cur[0]) + '"><span class="lp__n">0' + (i + 1) + '</span><span class="lp__b"><b>' + p[1] + '</b><span>' + p[2] + '</span>' + (p[0] === "warna" ? '<i class="lp__sw"></i>' : '') + '</span>' + ICON.arrow + '</button>';
    }).join("");
    return '<div class="lg__stage" style="--sx:' + cur[3] + ';--sy:' + cur[4] + ';--sr:' + cur[5] + '"><div class="lg__box"><img class="lg__img" alt="Logo IRIS: huruf IRIS bergaya jalur PCB dengan awan dan sinyal Wi-Fi" src="' + LOGO + '"><div class="lg__dim"></div><span class="lg__pin"></span></div><div class="lg__tb"><span>Fig. 1 · Filosofi Logo</span><span>Bagian ' + cur[1] + '</span></div></div><div class="lg__list">' + list + '</div>';
  }
  var DV = [["ASO","Academic Standard Operations","Modul, TP, TA dan jurnal praktikum.",4],["ARD","Advanced Research and Development","Riset dan alat IoT buatan lab.",4],["ADS","Attitude and Discipline Standards","Aturan lab dan kehadiran.",3],["ADC","Administration and Creative Documentation","Foto, video dan media sosial.",3],["AER","Affairs and External Relations","Acara eksternal dan pengadaan.",4],["ARM","Asset Resource Management","Aset, perawatan dan server lab.",3]];
  var TRACE = '<svg class="dv__trace" viewBox="0 0 150 74" aria-hidden="true"><path d="M0 16 H46 L60 30 H150 M0 40 H34 L48 54 H150 M84 0 V14 L98 28 H150" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="60" cy="30" r="3" fill="currentColor"/><circle cx="48" cy="54" r="3" fill="currentColor"/><circle cx="98" cy="28" r="3" fill="currentColor"/></svg>';
  function profile2() {
    var chap = [["tentang","Tentang"],["logo","Logo"],["divisi","Divisi"],["foto","Foto"],["acara","Acara"]].map(function (c) { return '<a href="#" data-ch="' + c[0] + '"' + (state.chap === c[0] ? ' aria-current="true"' : '') + '>' + c[1] + '</a>'; }).join("");
    var cols = ["var(--g1)","var(--g2)","var(--g3)","var(--g4)","var(--g5)","var(--g6)"];
    return '<nav class="chap" aria-label="Bab profil lab">' + chap + '</nav>' +
      '<section class="sec"><div class="about"><div><h2 style="margin-bottom:16px">IoT Runtime and Integration System</h2><p class="lead">IRIS Laboratory adalah laboratorium di bawah naungan Fakultas Teknik Elektro dengan fokus utama pengembangan Internet of Things (IoT), salah satu pilar penting dalam teknologi.</p><p>IRIS mendukung kegiatan praktikum IoT dengan program utama Praktikum Internet of Things. Lewat praktikum ini mahasiswa tidak hanya memahami konsep dasar IoT, tetapi juga berpengalaman merancang dan menerapkan sistem untuk kebutuhan nyata.</p><div class="chips"><span>Pemrograman mikrokontroler</span><span>Sensor dan aktuator</span><span>Komunikasi perangkat</span><span>Integrasi sistem</span><span>IoT dengan jaringan dan cloud</span></div></div><div class="photos" aria-hidden="true"><div class="photo photo--a">Foto jaket lab</div><div class="photo photo--b">Foto papan ESP32</div></div></div></section>' +
      '<section class="sec"><h2>Setiap Garis Punya Makna</h2><p class="sec__lede">Pilih satu bagian untuk melihatnya di logo.</p><div class="panel lg" id="lgsec">' + logoInner() + '</div></section>' +
      '<section class="sec"><h2>Enam Divisi, Satu Lab</h2><p class="sec__lede">Setiap Asisten IRIS mengajar di sesi praktikum dan memegang satu divisi. Buka kartunya untuk melihat orang di baliknya.</p><div class="dvs">' + DV.map(function (d, i) {
        return '<a class="dv" href="#" style="--c:' + cols[i] + '">' + TRACE + '<div class="dv__top"><span class="dv__led"></span><span class="dv__code">' + d[0] + '</span></div><h3>' + d[1] + '</h3><p>' + d[2] + '</p><div class="dv__foot"><div class="faces" aria-hidden="true">' + [0,1,2,3].slice(0, d[3]).map(function (k) { return '<i style="background:' + cols[(i + k) % 6] + '">' + String.fromCharCode(65 + ((i * 3 + k * 5) % 26)) + '</i>'; }).join("") + '</div><span class="mono">' + d[3] + ' orang</span>' + ICON.arrow.replace('<svg ', '<svg class="dv__go" ') + '</div></a>';
      }).join("") + '</div></section>' +
      '<div class="rest">Foto Bersama dan Acara memakai isi dan perilaku yang sama seperti sekarang, dengan bahasa kartu yang sama.</div>';
  }

  /* ---------- render ---------- */
  function render() {
    var v = state.view, k = state.banner === "auto" ? DEFAULT_BANNER[v] : state.banner, ban = k === "none" ? "" : k, n = state.worst ? 10 : 6;
    var name = state.worst ? "Immanuel Eben Haezer Joseph Aletheia" : "Rani Putri", ini = state.worst ? "IE" : "RP";
    var links = v === "visitor" ? [["Beranda",1],["Modul"]] : v.indexOf("asisten") === 0 ? [["Beranda",1],["Konsol"],["Persiapan"],["Penilaian"],["Jadwal"],["Lab"]] : [["Beranda",1],["Dasbor"],["Modul"]];
    $("#links").innerHTML = links.map(function (l) { return '<a href="#"' + (l[1] ? ' aria-current="page"' : '') + '>' + l[0] + '</a>'; }).join("");
    $("#avatar").hidden = v === "visitor"; $("#navcta").hidden = v !== "visitor"; $("#avatar").textContent = ini;
    var liveStats = [[String(n), "kelompok aktif"], ["28/30", "praktikan hadir"], ["74/108", "blank kode benar"], ["1.284", "pesan MQTT"]];
    var quietStats = [["0", "kelompok aktif"], ["0/30", "praktikan hadir"], ["0/0", "blank kode benar"], ["0", "pesan"]];
    var h;
    if (v === "visitor") h = visitorHero(ban);
    else if (v === "prak-live") h = signedHero(ban, pPrakLive(name), areaLive(n), liveStats);
    else if (v === "prak-idle") h = signedHero(ban, pPrakIdle(name), areaQuiet(false), quietStats);
    else if (v === "asisten") h = signedHero(ban, pAsisten(name, false), areaQuiet(false), quietStats);
    else h = signedHero(ban, pAsisten(name, true), areaLive(n), liveStats);
    $("#hero").innerHTML = h;
    document.documentElement.setAttribute("data-theme", state.theme);
    paintAll();
    $("#page").innerHTML = band() + profile2();
    $("#views").innerHTML = VIEWS.map(function (x) { return '<button data-v="' + x[0] + '" aria-pressed="' + (state.view === x[0]) + '">' + x[1] + '</button>'; }).join("");
    $("#banners").innerHTML = BANNERS.map(function (x) { return '<button data-b="' + x[0] + '" aria-pressed="' + (state.banner === x[0]) + '">' + x[1] + '</button>'; }).join("");
    $("#worst").setAttribute("aria-pressed", String(state.worst));
    $("#th-d").setAttribute("aria-pressed", String(state.theme === "dark")); $("#th-l").setAttribute("aria-pressed", String(state.theme === "light"));
    document.documentElement.setAttribute("data-theme", state.theme);
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-v],[data-b],[data-ch],[data-lp],#worst,#th-d,#th-l,a[href='#']");
    if (!t) return;
    if (t.dataset.lp) { state.logo = t.dataset.lp; $("#lgsec").innerHTML = logoInner(); return; }
    if (t.matches("a[href='#']") && !t.hasAttribute("data-ch")) { e.preventDefault(); return; }
    if (t.dataset.v) state.view = t.dataset.v;
    else if (t.dataset.b) state.banner = t.dataset.b;
    else if (t.dataset.ch) { e.preventDefault(); state.chap = t.dataset.ch; }
    else if (t.id === "worst") state.worst = !state.worst;
    else if (t.id === "th-d") state.theme = "dark";
    else if (t.id === "th-l") state.theme = "light";
    render();
  });
  render();
})();
</script>
