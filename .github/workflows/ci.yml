name: CI

# Two jobs run on every change here:
#
#   web      the Astro app (apps/web): typecheck, lint, format, unit tests,
#            build, CSP hash check
#   secrets  a repo-wide scan for anything that looks like a credential
#
# The other three suites live in their own workflows and run only when their
# own folder (or what they build from) changes, to save Actions minutes:
# games.yml (apps/games), relay.yml (apps/relay) and modul4.yml (apps/modul4,
# the same job IRIS ASO ran before Stage 15 moved this directory here).
# A run that a newer push to the same branch makes stale is cancelled.
#
# Deploying is not a job here. Vercel's own GitHub integration builds
# apps/web (the project's Root Directory) on every push: production from
# main, a preview for any other branch. The old deploy job was never
# enabled, and ran the CLI from apps/web, which under that Root Directory
# setting builds an empty site. A manual CLI deploy must run from the repo
# root (see apps/web/README.md).
#
# This repo is the web-development half of a larger project split out of
# Documents/Downloads/IRIS ASO into Documents/WebApps/iris-iot. Stage 15
# moved apps/modul4 here from that repo's modul4/ (it runs on the Orange
# PC, but building and testing it needs no hardware). What's left in the
# other repo is Typst journals, Arduino/Python practicum sources, and the
# pc/ folder that provisions and bundles the PC itself -- both bound
# to physical hardware paths this repo has no reason to know about. See
# each app's own README/PHASE3.md for more history.
#
# On "rebuild and diff" vs "rebuild and require success" for games: its
# index.html and public/index.html are gitignored, not committed -- the
# app's own docs describe them as local build output regenerated
# immediately before a manual deploy, never as version-controlled
# artifacts. With nothing committed, there is nothing for a rebuild to go
# stale against: every deploy is built from current source by construction.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck, lint, format, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Regenerates src/data/asisten.json from the vendored handbook copy
      # before anything else runs, so the build always reflects the
      # committed roster rather than a stale file left on disk (it is
      # gitignored -- see .gitignore's note on why).
      - name: Extract assistant roster from the vendored handbook copy
        run: python scripts/seed_asisten.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # A build-time placeholder. Nothing in the static build path
          # touches the database -- getDb() is called only from api/*
          # request handlers, which Vercel's own build never invokes -- but
          # setting this avoids any future accidental import-time access
          # throwing during `astro build` instead of failing loudly with a
          # clear message the way src/lib/db.ts intends.
          DATABASE_URL: "postgres://ci:ci@localhost:5432/ci_placeholder"
          SESSION_SECRET: "ci-only-placeholder-secret-not-for-production-use"

      # Catches a real, severe class of bug that every check above this line
      # is blind to: vercel.json's CSP can name script-src hashes that don't
      # match what actually shipped, silently blocking inline scripts (this
      # is exactly how the site's login form and tab switcher went dark
      # since the very first Phase 1 commit -- astro check/lint/tests/build
      # all passed the whole time, because none of them load a real browser
      # or enforce CSP).
      - name: CSP inline-script hashes match the build
        run: node scripts/check_csp_hashes.mjs
      # A chunk that names a stylesheet or script the build never wrote
      # (2026-10-23: Home went blank in production; see the script).
      - name: Every asset the build references exists
        run: node scripts/check_assets.mjs

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: scripts/check_secrets.py compares finding identities, not
      # the whole baseline file, specifically so version drift in
      # detect-secrets' own metadata format doesn't produce a false
      # failure -- but pinning is still the right default so a scan is
      # reproducible rather than merely tolerant of the alternative.
      - run: pip install detect-secrets==1.5.0
      - name: Compare against the audited baseline
        run: python scripts/check_secrets.py
      - name: Upload the fresh scan for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-scan
          path: fresh-scan.json
          retention-days: 7
