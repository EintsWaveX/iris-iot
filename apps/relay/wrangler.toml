# Konsol Pi relay (Phase 9 Stage 9). One Durable Object room per approved
# console pairs the browser and the Pi's bridge; it stores nothing but the
# nonces it has already accepted. The shared secret is set with
#   npx wrangler secret put KONSOL_RELAY_SECRET
# (the same value as KONSOL_RELAY_SECRET in the web app's Vercel env) and,
# for `wrangler dev`, in a git-ignored .dev.vars file.
name = "iris-konsol"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Answers on the domain (2026-10-17) and still on workers.dev, which tabs
# and the PC agent opened before the move keep using until they follow.
workers_dev = true
routes = [{ pattern = "konsol.irisiotlab.com", custom_domain = true }]

# The TP sync's minute timer (2026-10-14): wakes the site's /api/tp/detak,
# which says how long it may sleep. Not run by `wrangler dev`.
[triggers]
crons = ["* * * * *"]

[vars]
IRIS_SITUS = "https://irisiotlab.com"

[[durable_objects.bindings]]
name = "RUANG"
class_name = "Ruang"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ruang"]

# Live updates for every IRIS page (/siaran).
[[durable_objects.bindings]]
name = "SIARAN"
class_name = "Siaran"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Siaran"]

# Session streams (Phase 12): one room per running session, plus "pi".
[[durable_objects.bindings]]
name = "ALIRAN"
class_name = "Aliran"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Aliran"]

# LMS calls (Phase 13): made from a Durable Object, not the Worker that the
# IRIS API reached, so Cloudflare in front of the LMS does not see them as
# coming from Vercel's datacenter.
[[durable_objects.bindings]]
name = "LMS"
class_name = "Lms"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Lms"]

# TP files (2026-10-21): every Praktikan's TP, kept only by IRIS (src/tp.ts).
[[r2_buckets]]
binding = "TP"
bucket_name = "iris-tp"
